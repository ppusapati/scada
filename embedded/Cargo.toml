[package]
name = "scada-embedded"
version = "0.1.0"
edition = "2021"
description = "SCADA embedded firmware for STM32F407VGT6 - Water & Solar IoT"

# ─── Target: ARM Cortex-M4F (STM32F407VGT6) ───
# Build: cargo build --release --target thumbv7em-none-eabihf

[dependencies]
# Embassy async runtime for STM32
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.4", features = ["tick-hz-32_768"] }
embassy-sync = "0.6"
embassy-futures = "0.1"

# STM32F407 HAL via Embassy
embassy-stm32 = { version = "0.2", features = [
    "stm32f407vg",          # Our exact MCU
    "memory-x",             # Auto linker script
    "time-driver-any",      # Timer driver
    "exti",                 # External interrupts
    "unstable-pac",         # Direct PAC access when needed
] }

# Networking (Ethernet MAC on STM32F407)
embassy-net = { version = "0.5", features = ["tcp", "dhcpv4", "dns", "proto-ipv4"] }
embassy-net-driver = "0.2"

# Cortex-M essentials
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"                              # Efficient embedded logging
defmt-rtt = "0.4"                          # Log over RTT (debug probe)
panic-probe = { version = "0.3", features = ["print-defmt"] }

# Data handling (no_std compatible)
heapless = "0.8"                           # Fixed-size collections
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6"                    # no_std JSON
static_cell = "2.1"

# MQTT for no_std
rust-mqtt = { version = "0.3", default-features = false }

# Fixed-point math for sensor calculations
fixed = "1.28"
libm = "0.2"                               # Math functions for no_std

[features]
default = ["water-node"]
water-node = []
solar-node = []
simulator = ["dep:rand", "dep:tokio", "dep:rumqttc", "dep:serde_json", "dep:chrono", "dep:env_logger", "dep:log", "dep:toml", "dep:uuid"]

[dependencies.rand]
version = "0.8"
optional = true

[dependencies.tokio]
version = "1"
features = ["full"]
optional = true

[dependencies.rumqttc]
version = "0.24"
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.chrono]
version = "0.4"
features = ["serde"]
optional = true

[dependencies.env_logger]
version = "0.11"
optional = true

[dependencies.log]
version = "0.4"
optional = true

[dependencies.toml]
version = "0.8"
optional = true

[dependencies.uuid]
version = "1"
features = ["v4"]
optional = true

[[bin]]
name = "water-sensor"
path = "src/bin/water_sensor.rs"
required-features = ["simulator"]

[[bin]]
name = "solar-sensor"
path = "src/bin/solar_sensor.rs"
required-features = ["simulator"]

[profile.release]
opt-level = "s"        # Optimize for size (1MB flash)
lto = true             # Link-time optimization
debug = true           # Keep debug info for defmt
codegen-units = 1
