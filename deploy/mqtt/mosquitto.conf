# Mosquitto MQTT Broker Configuration for SCADA System

# Default listener for MQTT protocol
listener 1883
protocol mqtt

# WebSocket listener for browser-based clients
listener 9001
protocol websockets

# Allow anonymous connections (configure auth for production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Message size limit (256KB)
message_size_limit 262144

# Connection limits
max_connections -1
max_queued_messages 1000

# Keepalive
max_keepalive 120
