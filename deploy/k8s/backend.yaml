apiVersion: apps/v1
kind: Deployment
metadata:
  name: scada-backend
  namespace: scada
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scada-backend
  template:
    metadata:
      labels:
        app: scada-backend
    spec:
      containers:
        - name: backend
          image: scada-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: scada-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scada-secrets
                  key: db-password
            - name: DB_NAME
              value: scada_db
            - name: MQTT_BROKER
              value: mosquitto
            - name: MQTT_PORT
              value: "1883"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scada-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scada-backend
  namespace: scada
spec:
  selector:
    app: scada-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scada-ingress
  namespace: scada
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "scada-backend"
spec:
  rules:
    - host: scada.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: scada-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: scada-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scada-frontend
                port:
                  number: 3000
