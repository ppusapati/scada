# meta-scada — Yocto BSP Layer for SCADA DDS System
#
# This layer provides:
#   - scada-dds: Cortex-A7 Linux application (Rust/tokio DDS gateway)
#   - m4-firmware: Cortex-M4 real-time firmware (Rust/Embassy)
#   - PTP configuration for IEEE 1588 time synchronization
#   - OpenAMP/RPMsg kernel configuration
#   - Device tree overlays for SCADA-specific peripherals
#
# Dependencies:
#   - meta-st-stm32mp (STMicroelectronics BSP)
#   - meta-openembedded/meta-oe (for Rust toolchain support)
#   - meta-openembedded/meta-networking (for ptp4l/linuxptp)
#
# Usage:
#   Add to bblayers.conf:
#     BBLAYERS += "${BSPDIR}/sources/meta-scada"

# Layer configuration
BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"
BBFILE_COLLECTIONS += "meta-scada"
BBFILE_PATTERN_meta-scada = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-scada = "10"

# Layer compatibility — tested with these Yocto releases
LAYERCOMPAT_meta-scada = "kirkstone scarthgap"

# Layer dependencies
LAYERDEPENDS_meta-scada = " \
    core \
    meta-st-stm32mp \
    openembedded-layer \
    networking-layer \
"

# Layer version
LAYERVERSION_meta-scada = "1"

# SCADA system configuration variables
# These can be overridden in local.conf or machine conf

# Device variant: "solar_smu" or "water_rtu"
SCADA_DEVICE_TYPE ?= "solar_smu"

# DDS domain ID for network partitioning
SCADA_DDS_DOMAIN_ID ?= "42"

# Enable OTA firmware update support
SCADA_OTA_ENABLED ?= "1"

# Enable PTP time synchronization
SCADA_PTP_ENABLED ?= "1"

# Enable Modbus TCP gateway
SCADA_MODBUS_GATEWAY ?= "1"

# M4 firmware filename in /lib/firmware/
SCADA_M4_FIRMWARE ?= "stm32mp157-m4-scada.elf"
