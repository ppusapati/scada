[target.thumbv7em-none-eabihf]
# M4 firmware is loaded via remoteproc from A7 Linux
# For development, use probe-rs or OpenOCD via JTAG
runner = "probe-rs run --chip STM32MP157CACx"

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"

rustflags = [
    "-C", "link-arg=-Tmemory.x",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]
