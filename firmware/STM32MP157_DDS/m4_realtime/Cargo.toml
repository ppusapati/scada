[package]
name = "stm32mp157-m4-realtime"
version = "1.0.0"
edition = "2021"
description = "STM32MP157 Cortex-M4 real-time firmware with DDS/RPMsg for SCADA"
authors = ["P9e Microsystems Pvt Ltd"]

# Target: ARM Cortex-M4F (STM32MP157 M4 co-processor)
# Build:  cargo build --release --features solar_smu
# Deploy: Copy ELF to /lib/firmware/stm32mp157-m4.elf on A7 Linux

[dependencies]
# Embassy async runtime for Cortex-M4
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.4", features = ["tick-hz-32_768"] }
embassy-sync = "0.6"
embassy-futures = "0.1"

# STM32MP1 HAL — Cortex-M4 subsystem
embassy-stm32 = { version = "0.2", features = [
    "stm32mp157c",
    "time-driver-any",
    "exti",
    "unstable-pac",
] }

# Cortex-M essentials
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# Data handling (no_std)
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
static_cell = "2.1"

# Math for sensor calculations
libm = "0.2"

# CRC for Modbus RTU and protocol checksums
crc = "3.2"

# Byte-level protocol parsing
byteorder = { version = "1.5", default-features = false }

[features]
default = ["solar_smu"]
# Solar String Monitoring Unit variant — ADS1263 + dual MUX
solar_smu = []
# Water Remote Terminal Unit variant — ADS1258 + 4-20mA inputs
water_rtu = []

[profile.release]
opt-level = "s"
lto = true
debug = true
codegen-units = 1

[profile.dev]
opt-level = 1
debug = true
