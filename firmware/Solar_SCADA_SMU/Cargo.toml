[package]
name = "solar-scada-smu"
version = "1.0.0"
edition = "2021"
description = "Solar SCADA SMU firmware for SS-PCB-001 (STM32F407VGT6)"
authors = ["P9e Microsystems Pvt Ltd"]

# Target: ARM Cortex-M4F (STM32F407VGT6)
# Build:  cargo build --release
# Flash:  probe-rs run --chip STM32F407VGTx --release

[dependencies]
# Embassy async runtime
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.4", features = ["tick-hz-32_768"] }
embassy-sync = "0.6"
embassy-futures = "0.1"

# STM32F407 HAL
embassy-stm32 = { version = "0.2", features = [
    "stm32f407vg",
    "memory-x",
    "time-driver-any",
    "exti",
    "unstable-pac",
] }

# Cortex-M essentials
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# Data handling (no_std)
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
static_cell = "2.1"

# Math for sensor calculations
libm = "0.2"

# CRC for Modbus RTU
crc = "3.2"

# Byte-level protocol parsing
byteorder = { version = "1.5", default-features = false }

# Embedded SD card (SPI mode)
embedded-sdmmc = "0.8"

[profile.release]
opt-level = "s"
lto = true
debug = true
codegen-units = 1

[profile.dev]
opt-level = 1
debug = true
